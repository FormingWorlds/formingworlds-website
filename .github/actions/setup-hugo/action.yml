name: Set up Hugo
description: Install the Hugo extended version that builds this site.

runs:
  using: composite
  steps:
    - name: Install Hugo CLI
      shell: bash
      env:
        HUGO_VERSION: "0.147.0"
        # From hugo_${HUGO_VERSION}_checksums.txt on the release page; update it with the version.
        HUGO_SHA256: d2a308de005f87e2d5ffe76b6cab924509ccb59be542cd4ea5f9471c29176b1c
      run: |
        wget -O "${RUNNER_TEMP}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
        echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.deb" | sha256sum -c -
        sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
